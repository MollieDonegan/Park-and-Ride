<!doctype html>
<html>

<head>

  <title>YIELD TO THE FEELING</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: 'Share Tech Mono', monospace;
    }


    .background {
      position: fixed;
      width: auto;
      height: 100vh;
      max-width: 100vw;
      object-fit: contain;

      top: 0;
      left: 50%;
      transform: translateX(-50%);

      z-index: 1;
    }

  
    .text {
      position: fixed;

      color: white;

      font-size: 7vw;
      line-height: 0.9;

      z-index: 10;

      cursor: pointer;

      text-shadow: none;

      transition: text-shadow 0.2s ease;
    }

    .text:hover {
      text-shadow:
        0 0 5px white,
        0 0 10px #ff1493,
        0 0 20px #ff1493,
        0 0 40px #ff1493,
        0 0 70px #ff1493;
    }

    .one {
      top: 8%;
      left: 8%;
      transform: rotate(-8deg);
    }

    .two {
      top: 20%;
      right: 5%;
      transform: rotate(6deg);
    }

    .three {
      top: 43%;
      left: 28%;
      transform: rotate(-4deg);
    }

    .four {
      bottom: 18%;
      right: 8%;
      transform: rotate(8deg);
    }

    .five {
      bottom: 5%;
      left: 5%;
      transform: rotate(-6deg);
    }

  </style>

</head>

<body>


  <img
    class="background"
    src="hornycar.gif"
    alt=""
  >
  <a href="index.html">BACK TO START</a>

  <div class="text one">
    OOOOOOOHHHHHHHHH
  </div>

  <div class="text two">
    YEAAAAHHHHHHHHHH
  </div>

  <div class="text three">
    AAHHHHHHHHHHHHHH
  </div>

  <div class="text four">
    YEEEESSSSSSSSSSS
  </div>

  <div class="text five">
    OOOHHHHHHHHHHHHHH
  </div>


</body>

</html>
