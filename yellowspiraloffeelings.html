    html, body {
      margin: 0;

    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

  
    .road-image {
      position: absolute;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }



    .straight {
      top: 22%;
      left: 45%;
    }

    .left {
      top: 37%;
      left: 45%;
    }

    .right {
      top: 48%;
      left: 45%;
    }

    

    .text {
      position: fixed;

      color: white;

      font-size: 7vw;
      line-height: 0.9;

      z-index: 10;

      cursor: pointer;

      text-shadow: none;

      transition: text-shadow 0.2s ease;
    }

  

    .text:hover {
      text-shadow:
        0 0 5px white,
        0 0 10px #ff1493,
        0 0 20px #ff1493,
        0 0 40px #ff1493,
        0 0 70px #ff1493;
    }

    .one {
      top: 8%;
      left: 8%;
      transform: rotate(-8deg);
    }

    .two {
      top: 43%;
      left: 28%;
      transform: rotate(-4deg);
    }

  


  </style>
