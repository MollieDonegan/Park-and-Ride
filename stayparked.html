<!doctype html>
<html>

<head>

  <title>YIELD TO THE FEELING</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: 'Share Tech Mono', monospace;
    }

    .background {
      position: fixed;
      width: auto;
      height: 100vh;
      max-width: 100vw;
      object-fit: contain;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .story {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .text {
      position: absolute;
      top: 30px;
      left: 35px;
      color: white;
      font-size: 20px;
      line-height: 1.5;
      text-shadow: 0 0 8px black;
    }

    .text p {
      margin: 0 0 20px 0;
    }

    .choices {
      position: absolute;
      right: 70px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .choices a {
      color: white;
      text-decoration: none;
      font-size: 28px;
      text-shadow:
        0 0 5px white,
        0 0 15px white,
        0 0 30px white;
    }

    .choices a:hover {
      transform: scale(1.08);
    }

  </style>

</head>

<body>

  <img class="background" src="carwindow.jpg">

  <div class="story">

    <div class="text">

      <p>
        You drive by View Point car park.<br>
        There are other cars there.
      </p>

      <p>
        They ask if you want to park<br>
        or keep driving?
      </p>

    </div>

    <div class="choices">

      <a href="parkthere.html">PARK THERE</a>

      <a href="yellowcar.html">KEEP DRIVING</a>

      <a href="index.html">BACK TO START</a>

    </div>

  </div>

</body>

</html>
