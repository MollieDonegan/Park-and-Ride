<!doctype html>
<html>

<head>

  <style>

    html, body {

      line-height: 1.4;

    }

    .choices a {
      position: absolute;
      color: white;
      font-family: "Share Tech Mono", monospace;
      font-size: 25px;
      text-decoration: none;
      z-index: 2;
      transition: text-shadow 0.3s ease;
    }

    /* GLOW */

    .choices a:hover {
      text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 20px white,
        0 0 35px white;
    }

    /* FIND SOMEWHERE TO PARK */

    .stay {
